<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — MLS</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --ink:#0e2238; --ink2:#3a5575; --muted:#6a829c; --line:#e7edf4;
    --bg:#ffffff; --soft:#F3F7F5;
    --brand:#2563eb; --teal:#2E6A4B; --green:#127a4d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:560px;width:100%;text-align:center;padding:40px 28px}
  .mk{width:52px;height:52px;border-radius:14px;margin:0 auto 18px;
    background:linear-gradient(135deg,#2E6A4B,#2E6A4B);display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:26px}
  .code{font-size:15px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
  h1{font-size:clamp(26px,5vw,38px);font-weight:850;letter-spacing:-.03em;margin:10px 0 12px}
  p{color:var(--ink2);margin:0 0 26px}
  .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{display:inline-block;padding:12px 20px;border-radius:12px;font-weight:700;font-size:15px;
    text-decoration:none}
  .btn.primary{background:linear-gradient(135deg,#2E6A4B,#2E6A4B);color:#fff}
  .btn.ghost{color:var(--ink);border:1.5px solid var(--line);background:#fff}
  .btn.ghost:hover{background:var(--soft)}
  .links{margin-top:26px;font-size:14.5px;color:var(--muted)}
  .links a{color:var(--ink2);font-weight:600;text-decoration:none;margin:0 10px}
  .links a:hover{color:var(--ink);text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <div class="mk" aria-hidden="true">&#10022;</div>
    <div class="code">404 — PAGE NOT FOUND</div>
    <h1>That page isn't here.</h1>
    <p>The link may be old or mistyped. Everything MLS is still one click away.</p>
    <div class="btns">
      <a class="btn primary" href="/">Go to the homepage</a>
      <a class="btn ghost" href="/ScribeFlow.html">Sign in to MLS</a>
    </div>
    <div class="links">
      <a href="/#pricing">Pricing</a> ·
      <a href="/get-extension.html">Download the extension</a> ·
      <a href="mailto:michael@mlsscribe.com">Contact us</a>
    </div>
  </main>
</body>
</html>
