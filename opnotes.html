<body>
<div data-mls-phi-notice="1" role="note" aria-label="Confidential patient information" style="box-sizing:border-box;width:calc(100% - 24px);max-width:920px;margin:12px auto 0;padding:10px 12px;background:#F7F3E8;border:1px solid #E8DCC0;border-radius:10px;color:#5E5138;font:600 13px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;text-align:center"><strong>Confidential patient information.</strong> These are real operative notes. Do not forward this page, and do not pass on the code you signed in with.</div>
<div class="wrap">

  <div id="gate" class="card hide"></div>

      <button class="btn2" onclick="opnPickTemplate()">Add or replace a template</button>
      <p class="note">Word (.docx) or a text file.</p>

      <label for="tplName">Template name</label>

      <p class="said hide" id="tplMsg"></p>
    </div>
  </div>

<script>
/* ==========================================================================
   OP NOTES FOR A CLIENT SURGEON (lane opnote-svc-1.0.0)

   The whole page: one surgeon, their own drafted op notes, the few things only
   they can supply, and the templates those notes are written from. Nothing else
   of the clinical app is reachable from here — no patients, no schedule pull,
   no visit notes, no settings, no sign-in.

   THE LINK IS THE CREDENTIAL. It arrives in the URL fragment (#k=...), the
   head bootstrap captures it and strips it from the address bar before this
   script runs, and it is sent as a bearer credential on every call. There is no
   second exchange and nothing is stored, so revoking the link at the other end
   ends this page's access on the next press.

   ONE WRAPPED CALL SITE. Every request goes through opnApi() -> the head's
   mlsSensitiveFetch wrapper (cache:no-store, referrerPolicy:no-referrer).
   tests/sensitive-public-workflows-boundary.test.js pins that count at 1, which
   is deliberate: a second call site is a second place the credential could be
   handled differently.
   ========================================================================== */
var OPN_BASE = 'https://scrivara-backend.onrender.com';
var K = (function () { var u = window.__mlsSensitiveUrl || {}; return String((u.fragment && u.fragment.k) || (u.query && u.query.k) || '').trim(); })();
var OPN_SHAPE = /^[a-f0-9]{64}$/;
var opnJobs = [];
var opnOpen = null;
var opnTemplates = [];

function opnEsc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (m) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]; }); }
function opnEl(id) { return document.getElementById(id); }
function opnShow(id, on) { var e = opnEl(id); if (e) e.className = (e.className || '').replace(/\s*\bhide\b/g, '') + (on ? '' : ' hide'); }

/* The ONE wrapped call site. */
function opnApi(path, opts) {
  var o = {};
  var src = opts || {};
  for (var key in src) { if (Object.prototype.hasOwnProperty.call(src, key)) o[key] = src[key]; }
  o.headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + K };
  return window.mlsSensitiveFetch(OPN_BASE + path, o);
}

function opnGet(path) { return opnApi(path, { method: 'GET' }); }
function opnPost(path, body) { return opnApi(path, { method: 'POST', body: JSON.stringify(body || {}) }); }

/* The link is gone, or it was never good. One sentence, and the page shows
   nothing else — no list, no editor, no upload. */
function opnStopped(sentence) {
  var g = opnEl('gate');
  if (g) { g.textContent = sentence; g.className = 'card'; }
  var a = opnEl('app');
  if (a) a.className = 'hide';
}
function opnDead() { opnStopped('This link is no longer active. Ask for a new one.'); }
function opnTrouble() { opnStopped('That did not go through. Try again in a moment.'); }

function opnSay(id, sentence, bad) {
  var e = opnEl(id);
  if (!e) return;
  e.textContent = sentence;
  e.className = bad ? 'stop' : 'said';
}

/* ---- the list ---------------------------------------------------------- */
function opnRenderList() {
  var host = opnEl('list');
  if (!host) return;
  if (!opnJobs.length) { host.innerHTML = '<p class="sub">Nothing waiting for you right now.</p>'; return; }
  var h = '';
  for (var i = 0; i < opnJobs.length; i++) {
    var j = opnJobs[i];
    var left = Math.max(0, Number(j.blankCount || 0) - Number(j.filledCount || 0));
    var state = (j.status === 'completed') ? 'Done' : ('Needs you: ' + left + ' to fill');
    h += '<button class="jobrow" onclick="opnOpenJob(\'' + opnEsc(j.id) + '\')">' +
      '<span class="jobtitle">' + opnEsc(j.title || 'Op note') + '</span>' +
      '<span class="jobstate' + (j.status === 'completed' ? ' done' : '') + '">' + opnEsc(state) + '</span>' +
      '</button>';
  }
  host.innerHTML = h;
}

/* ---- one op note ------------------------------------------------------- */
function opnRenderJob(job) {
  opnOpen = job;
  var blanks = job.blanks || [];
  var h = '<span class="pill">' + opnEsc(job.title || 'Op note') + '</span>';
  if (blanks.length) {
    h += '<h2>Fill these in</h2>';
    for (var i = 0; i < blanks.length; i++) {
      var b = blanks[i];
      h += '<label for="opnB_' + opnEsc(b.key) + '">' + opnEsc(b.label || b.key) + '</label>' +
        '<input id="opnB_' + opnEsc(b.key) + '" value="' + opnEsc(b.value || '') + '" autocomplete="off">';
    }
    h += '<p class="note">Type what you used. Anything you leave empty stays as it is in the note.</p>';
  }
  h += '<h2>The note</h2>' +
    '<p class="note">You can change any of this.</p>' +
    '<textarea id="opnNote" class="note-body">' + opnEsc(job.noteText || '') + '</textarea>' +
    '<button class="btn" onclick="opnSaveJob()">Save</button>' +
    '<button class="btn2" onclick="opnCompleteJob()">Mark done</button>' +
    '<p class="said hide" id="jobMsg"></p>' +
    opnRefitHtml(job);
  var card = opnEl('jobCard');
  if (card) { card.innerHTML = h; card.className = 'card'; }
}

function opnCollect() {
  var blanks = [];
  var open = opnOpen || {};
  var list = open.blanks || [];
  for (var i = 0; i < list.length; i++) {
    var field = opnEl('opnB_' + list[i].key);
    blanks.push({ key: list[i].key, value: field ? String(field.value || '') : String(list[i].value || '') });
  }
  var body = opnEl('opnNote');
  return { blanks: blanks, noteText: body ? String(body.value || '') : String(open.noteText || '') };
}

function opnRemember(patch) {
  for (var i = 0; i < opnJobs.length; i++) {
    if (opnJobs[i].id === (opnOpen && opnOpen.id)) {
      for (var key in patch) { if (Object.prototype.hasOwnProperty.call(patch, key)) opnJobs[i][key] = patch[key]; }
    }
  }
  opnRenderList();
}

async function opnOpenJob(id) {
  try {
    var r = await opnGet('/api/client/opnotes/jobs/' + encodeURIComponent(id));
    if (r.status === 401) { opnDead(); return; }
    if (!r.ok) { opnSay('jobMsg', 'That did not go through. Try again in a moment.', true); opnShow('jobMsg', true); return; }
    var d = await r.json();
    opnUndoText = '';
    opnRenderJob(d.job || {});
  } catch (e) { opnTrouble(); }
}

async function opnSaveJob() {
  if (!opnOpen) return;
  var picked = opnCollect();
  try {
    var r = await opnPost('/api/client/opnotes/jobs/' + encodeURIComponent(opnOpen.id) + '/save',
      { noteText: picked.noteText, blanks: picked.blanks, expectedVersion: opnOpen.version });
    if (r.status === 401) { opnDead(); return; }
    if (r.status === 409) { opnSay('jobMsg', 'Someone else changed this note. Reload the page to see the newest one.', true); opnShow('jobMsg', true); return; }
    if (!r.ok) { opnSay('jobMsg', 'That did not go through. Try again in a moment.', true); opnShow('jobMsg', true); return; }
    var d = await r.json();
    var saved = d.job || {};
    opnOpen.version = saved.version;
    opnOpen.noteText = picked.noteText;
    opnRemember({ filledCount: saved.filledCount, updatedAt: saved.updatedAt });
    opnSay('jobMsg', 'Saved.', false);
    opnShow('jobMsg', true);
  } catch (e) { opnSay('jobMsg', 'That did not go through. Try again in a moment.', true); opnShow('jobMsg', true); }
}

async function opnCompleteJob() {
  if (!opnOpen) return;
  try {
    var r = await opnPost('/api/client/opnotes/jobs/' + encodeURIComponent(opnOpen.id) + '/complete', { expectedVersion: opnOpen.version });
    if (r.status === 401) { opnDead(); return; }
    if (r.status === 409) { opnSay('jobMsg', 'Someone else changed this note. Reload the page to see the newest one.', true); opnShow('jobMsg', true); return; }
    if (!r.ok) { opnSay('jobMsg', 'That did not go through. Try again in a moment.', true); opnShow('jobMsg', true); return; }
    var d = await r.json();
    opnRemember({ status: (d.job && d.job.status) || 'completed' });
    opnSay('jobMsg', 'Done. Nothing else to do.', false);
    opnShow('jobMsg', true);
  } catch (e) { opnSay('jobMsg', 'That did not go through. Try again in a moment.', true); opnShow('jobMsg', true); }
}

/* ---- wrong template ----------------------------------------------------- */
/* retemplate-2.0.0. The note is written from whichever template matched its
   name, and that match is sometimes wrong - in one measured library, 199
   templates sat under 102 names and a 433-character stub with no operative
   narrative beat four full siblings that shared its name. The surgeon is the
   only person who can see that has happened, so the way out belongs here.

   This is deliberately ONE control and a plain sentence. It rewrites the note
   they already have into the shape of the template they pick. It is not a
   re-generation and no new clinical fact can enter: the server refuses a
   rewrite that lost a number or a blank and keeps the note exactly as it was.
   The previous wording is held in memory for one press of Put it back, which
   is why that button appears only after a rewrite and vanishes on save. */
var opnUndoText = '';
function opnRefitHtml(job) {
  var rows = opnTemplates || [];
  if (!rows.length) return '';
  var h = '<h2>Wrong template?</h2>' +
    '<p class="note">Pick the one this operation should have been written from and it will be rewritten to match. Read it before you mark it done.</p>' +
    '<select id="opnRefitPick">';
  for (var i = 0; i < rows.length; i++) {
    var sel = (String(rows[i].id) === String(job && job.templateId || '')) ? ' selected' : '';
    h += '<option value="' + opnEsc(rows[i].id) + '"' + sel + '>' + opnEsc(rows[i].name || 'Template') + '</option>';
  }
  h += '</select>' +
    '<button class="btn2" id="opnRefitGo" onclick="opnRefit()">Rewrite it with this template</button>' +
    '<button class="btn2 hide" id="opnRefitUndo" onclick="opnRefitUndo()">Put it back</button>' +
    '<p class="said hide" id="refitMsg"></p>';
  return h;
}

async function opnRefit() {
  if (!opnOpen) return;
  var pick = opnEl('opnRefitPick');
  var tid = pick ? String(pick.value || '') : '';
  if (!tid) return;
  var go = opnEl('opnRefitGo');
  if (go) { go.disabled = true; go.textContent = 'Rewriting...'; }
  opnSay('refitMsg', 'This takes a few seconds.', false);
  opnShow('refitMsg', true);
  try {
    var r = await opnPost('/api/client/opnotes/jobs/' + encodeURIComponent(opnOpen.id) + '/retemplate',
      { templateId: tid, expectedVersion: opnOpen.version });
    if (r.status === 401) { opnDead(); return; }
    var d = null;
    try { d = await r.json(); } catch (e) { d = null; }
    if (go) { go.disabled = false; go.textContent = 'Rewrite it with this template'; }
    if (r.status === 409 && d && d.error && d.error.code === 'OPNOTE_REFIT_UNSAFE') {
      /* The server would not store it, so nothing on this page changed. Say
         exactly that, because a surgeon who thinks a rewrite half-landed will
         go looking for what it did to their note. */
      opnSay('refitMsg', 'That rewrite left something out, so your note is exactly as it was. Edit it here instead.', true);
      opnShow('refitMsg', true);
      return;
    }
    if (r.status === 409) { opnSay('refitMsg', 'Someone else changed this note. Reload the page to see the newest one.', true); opnShow('refitMsg', true); return; }
    if (!r.ok || !d || !d.job) { opnSay('refitMsg', 'That did not go through. Try again in a moment.', true); opnShow('refitMsg', true); return; }
    var body = opnEl('opnNote');
    opnUndoText = String(d.previousText || (body ? body.value : '') || '');
    if (body) body.value = String(d.job.noteText || '');
    opnOpen.version = d.job.version;
    opnOpen.noteText = String(d.job.noteText || '');
    opnOpen.templateId = d.job.templateId || '';
    opnShow('opnRefitUndo', true);
    opnSay('refitMsg', 'Rewritten. Read it through, then Save.', false);
    opnShow('refitMsg', true);
  } catch (e) {
    if (go) { go.disabled = false; go.textContent = 'Rewrite it with this template'; }
    opnSay('refitMsg', 'That did not go through. Try again in a moment.', true);
    opnShow('refitMsg', true);
  }
}

/* Put it back only restores the WORDS. It does not undo the rewrite on the
   server; pressing Save after it is what makes the old wording the stored note
   again, and the sentence says so. */
function opnRefitUndo() {
  var body = opnEl('opnNote');
  if (!body || !opnUndoText) return;
  body.value = opnUndoText;
  opnShow('opnRefitUndo', false);
  opnSay('refitMsg', 'Put back. Press Save to keep it that way.', false);
  opnShow('refitMsg', true);
}

/* ---- templates --------------------------------------------------------- */
function opnRenderTemplates(list) {
  var host = opnEl('tplList');
  opnTemplates = list || [];
  if (!host) return;
  var rows = list || [];
  if (!rows.length) { host.innerHTML = '<p class="sub">Nothing here yet.</p>'; return; }
  var h = '';
  for (var i = 0; i < rows.length; i++) {
    h += '<div class="jobrow"><span class="jobtitle">' + opnEsc(rows[i].name || 'Template') + '</span></div>';
  }
  host.innerHTML = h;
}

function opnPickTemplate() { var f = opnEl('tplFile'); if (f && f.click) f.click(); }

/* Cleaning copied from the clinical app's own reader so a template reads the
   same here as it does there. */
function opnCleanText(t, lower) {
  t = String(t || '');
  if (/\.rtf$/.test(lower)) { t = t.replace(/\\par[d]?\b/g, '\n').replace(/\\'[0-9a-fA-F]{2}/g, '').replace(/\{\\\*[^{}]*\}/g, '').replace(/\\[a-zA-Z]+-?\d*\s?/g, '').replace(/[{}]/g, ''); }
  return t.replace(/\x00/g, '').replace(/[ \t]{3,}/g, '  ').replace(/\n{3,}/g, '\n\n').trim();
}

function opnTemplateChosen(input) {
  var f = input && input.files && input.files[0];
  if (!f) return;
  return opnReadTemplateFile(f);
}

async function opnReadTemplateFile(f) {
  var name = String(f.name || '');
  var lower = name.toLowerCase();
  if (/\.(pdf|png|jpe?g|heic|heif|gif|webp|tiff?|bmp)$/.test(lower)) {
    opnSay('tplMsg', 'Save it as a Word file or paste the text instead.', true);
    opnShow('tplMsg', true);
    return;
  }
  var text = '';
  try {
    if (/\.docx$/.test(lower)) {
      var buf = await f.arrayBuffer();
      var out = await window.mammoth.extractRawText({ arrayBuffer: buf });
      text = opnCleanText((out && out.value) || '', lower);
    } else {
      text = opnCleanText(await f.text(), lower);
    }
  } catch (e) {
    opnSay('tplMsg', 'That did not go through. Try again in a moment.', true);
    opnShow('tplMsg', true);
    return;
  }
  if (!text) {
    opnSay('tplMsg', 'Save it as a Word file or paste the text instead.', true);
    opnShow('tplMsg', true);
    return;
  }
  return opnSendTemplate(name.replace(/\.[A-Za-z0-9]+$/, '') || 'Template', text);
}

function opnSavePastedTemplate() {
  var nameField = opnEl('tplName');
  var pasteField = opnEl('tplPaste');
  var name = nameField ? String(nameField.value || '').trim() : '';
  var text = pasteField ? String(pasteField.value || '').trim() : '';
  if (!name || !text) {
    opnSay('tplMsg', 'Give it a name and paste the text first.', true);
    opnShow('tplMsg', true);
    return;
  }
  return opnSendTemplate(name, text);
}

async function opnSendTemplate(name, text) {
  try {
    var r = await opnPost('/api/client/opnotes/templates', { name: name, text: text });
    if (r.status === 401) { opnDead(); return; }
    if (!r.ok) { opnSay('tplMsg', 'That did not go through. Try again in a moment.', true); opnShow('tplMsg', true); return; }
    var d = await r.json();
    opnRenderTemplates(d.templates || []);
    var nameField = opnEl('tplName'); if (nameField) nameField.value = '';
    var pasteField = opnEl('tplPaste'); if (pasteField) pasteField.value = '';
    opnSay('tplMsg', 'Template saved.', false);
    opnShow('tplMsg', true);
  } catch (e) { opnSay('tplMsg', 'That did not go through. Try again in a moment.', true); opnShow('tplMsg', true); }
}

/* ---- opening the page -------------------------------------------------- */
async function opnBoot() {
  if (!OPN_SHAPE.test(K)) { opnDead(); return; }
  var who;
  try {
    var r = await opnGet('/api/client/opnotes/session');
    if (r.status === 401 || r.status === 403 || r.status === 404) { opnDead(); return; }
    if (!r.ok) { opnTrouble(); return; }
    who = await r.json();
  } catch (e) { opnTrouble(); return; }

  var client = (who && who.client) || {};
  var hdr = opnEl('hdr'); if (hdr) hdr.textContent = 'Op notes for ' + (client.name || 'you');
  var sub = opnEl('sub'); if (sub) sub.textContent = 'Everything is written for you. Fill in what only you know, then mark it done.';
  opnShow('gate', false);
  opnShow('app', true);

  /* Templates first on purpose: opening a note paints its Wrong template
     control from this list, and a list that arrives afterwards would give the
     first note the surgeon opens no way out of a bad match. */
  try {
    var tr = await opnGet('/api/client/opnotes/templates');
    if (tr.ok) { var td = await tr.json(); opnRenderTemplates((td && td.templates) || []); }
  } catch (e) { opnRenderTemplates([]); }

  try {
    var jr = await opnGet('/api/client/opnotes/jobs');
    if (jr.status === 401) { opnDead(); return; }
    if (jr.ok) { var jd = await jr.json(); opnJobs = (jd && jd.jobs) || []; }
  } catch (e) { opnJobs = []; }
  opnRenderList();
}

window.opnReady = opnBoot();
</script>
