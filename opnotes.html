<style>

<body>
<div data-mls-phi-notice="1" role="note" aria-label="Confidential patient information" style="box-sizing:border-box;width:calc(100% - 24px);max-width:920px;margin:12px auto 0;padding:10px 12px;background:#F7F3E8;border:1px solid #E8DCC0;border-radius:10px;color:#5E5138;font:600 13px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;text-align:center"><strong>Confidential patient information.</strong> These are real operative notes. Do not forward this page, and do not pass on the code you signed in with.</div>
<div class="wrap">
  <div class="brand"><span class="mark">+</span> <span>MLS Scribe</span></div>

  <div id="gate" class="card hide"></div>

  <div id="app" class="hide">

    </div>

    <div id="jobCard" class="card hide"></div>

    <div class="card">
      <h2>Your templates</h2>
      <p class="sub">These are the templates your op notes are written from.</p>
      <div id="tplList"></div>
      <button class="btn2 hide" id="opnMineBtn" onclick="opnUseMine()">Use my MLS Scribe templates</button>
      <button class="btn2" onclick="opnPickTemplate()">Add or replace a template</button>
      <p class="note">Word (.docx) or a text file.</p>
      <input id="tplFile" type="file" accept=".docx,.txt,.md,.rtf,.csv,.htm,.html" class="hide" onchange="opnTemplateChosen(this)">
      <label for="tplName">Template name</label>

      <label for="tplPaste">Or paste the template text</label>
      <textarea id="tplPaste" class="paste"></textarea>
      <button class="btn2" onclick="opnSavePastedTemplate()">Save this template</button>
      <p class="said hide" id="tplMsg"></p>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   OP NOTES FOR A CLIENT SURGEON (lane opnote-svc-1.0.0)

   The whole page: one surgeon, their own drafted op notes, the few things only
   they can supply, and the templates those notes are written from. Nothing else
   of the clinical app is reachable from here — no patients, no schedule pull,
   no visit notes, no settings, no sign-in.

   THE LINK IS THE CREDENTIAL. It arrives in the URL fragment (#k=...), the
   head bootstrap captures it and strips it from the address bar before this
   script runs, and it is sent as a bearer credential on every call. There is no
   second exchange and nothing is stored, so revoking the link at the other end
   ends this page's access on the next press.

   ONE WRAPPED CALL SITE. Every request goes through opnApi() -> the head's
   mlsSensitiveFetch wrapper (cache:no-store, referrerPolicy:no-referrer).
   tests/sensitive-public-workflows-boundary.test.js pins that count at 1, which
   is deliberate: a second call site is a second place the credential could be
   handled differently.
   ========================================================================== */
var OPN_BASE = 'https://scrivara-backend.onrender.com';
var K = (function () { var u = window.__mlsSensitiveUrl || {}; return String((u.fragment && u.fragment.k) || (u.query && u.query.k) || '').trim(); })();
var OPN_SHAPE = /^[a-f0-9]{64}$/;
var opnJobs = [];
var opnOpen = null;
var opnTemplates = [];
/* signin-2.0.1: THE LINK SAYS WHICH SURGEON. THE CODE PROVES THEY ARE THAT ONE.

   The link on its own now reaches exactly two things: a probe that answers "not
   in yet" with a mask of the address on file, and the door that mails a
   six-digit code to THAT address. Everything else takes the credential the code
   buys. opnCred() is what every call carries, and it is the session the moment
   there is one.

   The session lives in sessionStorage, so a reload does not ask for another
   code and closing the tab ends it. It is stored beside the first 8 characters
   of the link it belongs to: a second link opened in the same tab must not be
   able to walk in on the first one's sign-in. Eight hex characters cannot be
   walked back to the 64 the link is made of, and the backend already keeps a
   prefix of its own for the same reason. */
var OPN_SESS_KEY = 'mlsOpnoteSession';
var OPN_SESS_RE = /^sess_[a-f0-9]{64}$/;
var opnSess = '';
function opnCred() { return opnSess || K; }
function opnLinkTag() { return String(K || '').slice(0, 8); }
function opnSessLoad() {
  try {
    var raw = window.sessionStorage.getItem(OPN_SESS_KEY);
    if (!raw) return;
    var o = JSON.parse(raw);
    if (o && o.tag === opnLinkTag() && OPN_SESS_RE.test(String(o.s || ''))) opnSess = String(o.s);
  } catch (e) { opnSess = ''; }
}
function opnSessSave() {
  try { window.sessionStorage.setItem(OPN_SESS_KEY, JSON.stringify({ tag: opnLinkTag(), s: opnSess })); }
  catch (e) { /* a private window refuses storage; the sign-in still works for this page */ }
}
function opnSessDrop() {
  opnSess = '';
  try { window.sessionStorage.removeItem(OPN_SESS_KEY); } catch (e) {}
}

function opnEsc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (m) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]; }); }
function opnEl(id) { return document.getElementById(id); }
function opnShow(id, on) { var e = opnEl(id); if (e) e.className = (e.className || '').replace(/\s*\bhide\b/g, '') + (on ? '' : ' hide'); }

/* The ONE wrapped call site. */
function opnApi(path, opts) {
  var o = {};
  var src = opts || {};
  for (var key in src) { if (Object.prototype.hasOwnProperty.call(src, key)) o[key] = src[key]; }
  o.headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + opnCred() };
  return window.mlsSensitiveFetch(OPN_BASE + path, o);
}

function opnGet(path) { return opnApi(path, { method: 'GET' }); }
function opnPost(path, body) { return opnApi(path, { method: 'POST', body: JSON.stringify(body || {}) }); }

/* The link is gone, or it was never good. One sentence, and the page shows
   nothing else — no list, no editor, no upload. */
function opnStopped(sentence) {
  var g = opnEl('gate');
  if (g) { g.textContent = sentence; g.className = 'card'; }
  var a = opnEl('app');
  if (a) a.className = 'hide';
}
function opnDead() { opnStopped('This link is no longer active. Ask for a new one.'); }
function opnTrouble() { opnStopped('That did not go through. Try again in a moment.'); }

/* A 401 used to mean one thing. It now means two, and telling them apart is the
   difference between "sign in again" and "your link is gone" - a surgeon sent
   to find a new link when all they needed was a fresh code is a surgeon who
   rings the practice. The server says which: OPNOTE_SIGNIN_REQUIRED is the
   session, anything else is the link itself. Returns true when it handled it. */
async function opnHandle401(r) {
  var code = '';
  try { var d = await r.json(); code = String(((d || {}).error || {}).code || ''); } catch (e) { code = ''; }
  if (code === 'OPNOTE_SIGNIN_REQUIRED') { opnSessDrop(); opnSignInCard(''); return true; }
  opnDead();
  return true;
}

function opnSay(id, sentence, bad) {
  var e = opnEl(id);
  if (!e) return;
  e.textContent = sentence;
  e.className = bad ? 'stop' : 'said';
}

/* ---- signing in --------------------------------------------------------- */
/* One card, one thing to do at a time: ask for the code, then type it. It is
   painted into the gate, so nothing of the notes exists on the page until the
   code has been accepted - not a title, not a count, not a name. */
var opnHint = '';
function opnSignInCard(say) {
  var g = opnEl('gate');
  if (!g) return;
  var a = opnEl('app'); if (a) a.className = 'hide';
  var to = opnHint ? ('We will email a code to ' + opnEsc(opnHint) + '.') : 'We will email you a code.';
  g.className = 'card';
  g.innerHTML =
    '<h2>Sign in to see your op notes</h2>' +
    '<p class="sub">' + to + ' It is good for a few minutes.</p>' +
    '<button class="btn" id="opnCodeBtn" onclick="opnAskCode()">Email me a code</button>' +
    '<div id="opnCodeWrap" class="hide">' +
      '<label for="opnCode">The six-digit code</label>' +
      '<input id="opnCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">' +
      '<button class="btn" onclick="opnVerify()">Sign in</button>' +
    '</div>' +
    '<p class="said hide" id="opnSignMsg"></p>';
  if (say) { opnSay('opnSignMsg', say, true); opnShow('opnSignMsg', true); }
}

async function opnAskCode() {
  var b = opnEl('opnCodeBtn');
  if (b) { b.disabled = true; b.textContent = 'Sending...'; }
  try {
    var r = await opnPost('/api/client/opnotes/code', {});
    var d = null; try { d = await r.json(); } catch (e) { d = null; }
    if (b) { b.disabled = false; b.textContent = 'Send another code'; }
    if (r.ok) {
      if (d && d.emailHint) opnHint = String(d.emailHint);
      opnShow('opnCodeWrap', true);
      opnSay('opnSignMsg', 'Sent. Type the code below.', false);
      opnShow('opnSignMsg', true);
      var f = opnEl('opnCode'); if (f && f.focus) { try { f.focus(); } catch (e) {} }
      return;
    }
    /* The server's own sentence is the right one here: it knows whether this is
       a wait, a missing address, or mail being switched off, and each of those
       needs a different thing from the surgeon. It is written to be read by
       one. Anything unrecognised falls back to a sentence of ours. */
    var said = String(((d || {}).error || {}).message || '');
    opnSay('opnSignMsg', said || 'That did not go through. Try again in a moment.', true);
    opnShow('opnSignMsg', true);
  } catch (e) {
    if (b) { b.disabled = false; b.textContent = 'Email me a code'; }
    opnSay('opnSignMsg', 'That did not go through. Try again in a moment.', true);
    opnShow('opnSignMsg', true);
  }
}

async function opnVerify() {
  var f = opnEl('opnCode');
  var code = f ? String(f.value || '').replace(/\s+/g, '') : '';
  if (!/^[0-9]{6}$/.test(code)) {
    opnSay('opnSignMsg', 'Type the six digits from the email.', true);
    opnShow('opnSignMsg', true);
    return;
  }
  try {
    var r = await opnPost('/api/client/opnotes/verify', { code: code });
    var d = null; try { d = await r.json(); } catch (e) { d = null; }
    if (r.ok && d && d.session) {
      opnSess = String(d.session);
      opnSessSave();
      if (f) f.value = '';
      await opnOpenApp(d.client || {}, d);
      return;
    }
    var said = String(((d || {}).error || {}).message || '');
    opnSay('opnSignMsg', said || 'That code did not work, so ask for a new one and try again.', true);
    opnShow('opnSignMsg', true);
  } catch (e) {
    opnSay('opnSignMsg', 'That did not go through. Try again in a moment.', true);
    opnShow('opnSignMsg', true);
  }
}

/* ---- the list ---------------------------------------------------------- */
function opnRenderList() {
  var host = opnEl('list');
  if (!host) return;
  if (!opnJobs.length) { host.innerHTML = '<p class="sub">Nothing waiting for you right now.</p>'; return; }
  var h = '';
  for (var i = 0; i < opnJobs.length; i++) {
    var j = opnJobs[i];
    var left = Math.max(0, Number(j.blankCount || 0) - Number(j.filledCount || 0));
    var state = (j.status === 'completed') ? 'Done' : ('Needs you: ' + left + ' to fill');
    h += '<button class="jobrow" onclick="opnOpenJob(\'' + opnEsc(j.id) + '\')">' +
      '<span class="jobtitle">' + opnEsc(j.title || 'Op note') + '</span>' +
      '<span class="jobstate' + (j.status === 'completed' ? ' done' : '') + '">' + opnEsc(state) + '</span>' +
      '</button>';
  }
  host.innerHTML = h;
}

/* ---- one op note ------------------------------------------------------- */
/* opnsvc-1.0.0: WHAT YOU TYPE GOES INTO THE NOTE. The server used to keep the
   values beside the note and never put them in it, so the practice read the
   note back without them. Now Save and Mark done put each value into its own
   blank and hand the note back with it in, and this page shows exactly that.
   Only the blanks still waiting in the note get a field (a blank already
   filled in is listed, not asked again); an older reply with no state still
   gets a field for every blank. */
function opnAsks(b) { var st = String((b && b.state) || 'open'); return st === 'open' || st === 'loose'; }
function opnRenderJob(job) {
  opnOpen = job;
  var blanks = job.blanks || [];
  var ask = [], done = [];
  for (var n = 0; n < blanks.length; n++) {
    if (opnAsks(blanks[n])) ask.push(blanks[n]);
    else if (String(blanks[n].state) === 'placed') done.push(blanks[n]);
  }
  var h = '<span class="pill">' + opnEsc(job.title || 'Op note') + '</span>';
  if (ask.length) {
    h += '<h2>Fill these in</h2>';
    for (var i = 0; i < ask.length; i++) {
      var b = ask[i];
      h += '<label for="opnB_' + opnEsc(b.key) + '">' + opnEsc(b.label || b.key) + '</label>' +
        '<input id="opnB_' + opnEsc(b.key) + '" value="' + opnEsc(b.value || '') + '" autocomplete="off">';
    }
    h += '<p class="note">Type what you used. Anything you leave empty stays as it is in the note.</p>';
  }
  if (done.length) {
    var put = [];
    for (var d = 0; d < done.length; d++) put.push(opnEsc(done[d].label || done[d].key) + ': ' + opnEsc(done[d].value || ''));
    h += '<p class="note" id="opnPut">Already in the note: ' + put.join('; ') + '.</p>';
  }
  h += '<h2>The note</h2>' +
    '<p class="note">You can change any of this.</p>' +
    '<textarea id="opnNote" class="note-body">' + opnEsc(job.noteText || '') + '</textarea>' +
    '<button class="btn" onclick="opnSaveJob()">Save</button>' +
    '<button class="btn2" onclick="opnCompleteJob()">Mark done</button>' +
    '<p class="said hide" id="jobMsg"></p>' +
    opnRefitHtml(job);
  var card = opnEl('jobCard');
  if (card) { card.innerHTML = h; card.className = 'card'; }
}

function opnCollect() {
  var blanks = [];
  var open = opnOpen || {};
  var list = open.blanks || [];
  for (var i = 0; i < list.length; i++) {
    if (!opnAsks(list[i])) continue;
    var field = opnEl('opnB_' + list[i].key);
    blanks.push({ key: list[i].key, value: field ? String(field.value || '') : String(list[i].value || '') });
  }
  var body = opnEl('opnNote');
  return { blanks: blanks, noteText: body ? String(body.value || '') : String(open.noteText || '') };
}

/* Anything typed on this page that the server has not got yet. */
function opnDirty() {
  if (!opnOpen) return false;
  var picked = opnCollect();
  if (picked.noteText !== String(opnOpen.noteText || '')) return true;
  var list = opnOpen.blanks || [];
  for (var i = 0; i < picked.blanks.length; i++) {
    for (var j = 0; j < list.length; j++) {
      if (list[j].key === picked.blanks[i].key && String(list[j].value || '') !== picked.blanks[i].value) return true;
    }
  }
  return false;
}

/* A value whose blank is no longer in the note (it was edited out, or the
   blank lines were changed so nobody can say which is which) is never guessed
   into a spot. The server hands it back by name and this says so, in words -
   on every save and every open until it is typed in (opnsvc-1.0.0). */
function opnNotPlacedSentence(list) {
  var rows = list || [];
  if (!rows.length) return '';
  var bits = [];
  for (var i = 0; i < rows.length; i++) bits.push(String(rows[i].label || rows[i].key || '') + ': ' + String(rows[i].value || ''));
  return ' ' + (rows.length === 1 ? 'This was' : 'These were') + ' not put into the note because ' +
    (rows.length === 1 ? 'its blank is no longer where it was' : 'their blanks are no longer where they were') + ', so type ' +
    (rows.length === 1 ? 'it' : 'them') + ' in where ' + (rows.length === 1 ? 'it belongs' : 'they belong') + ': ' + bits.join('; ') + '.';
}

var OPN_SAY_REVIEW = 'Something in the note cannot be saved as it is - a bracket left open, or a line like TODO or DRAFT. Change it and save again.';

/* Save and Mark done are the same write on the server: each sends the words on
   screen and every value typed, and gets the note back with the values in it.
   Returns the job the server settled on, or null after saying why not. */
async function opnPush(where, msgId) {
  var picked = opnCollect();
  var r = await opnPost('/api/client/opnotes/jobs/' + encodeURIComponent(opnOpen.id) + '/' + where,
    { noteText: picked.noteText, blanks: picked.blanks, expectedVersion: opnOpen.version });
  if (r.status === 401) { await opnHandle401(r); return null; }
  if (r.status === 409) { opnSay(msgId, 'Someone else changed this note. Reload the page to see the newest one.', true); opnShow(msgId, true); return null; }
  if (r.status === 422) {
    var e = null; try { e = await r.json(); } catch (x) { e = null; }
    var err = (e && e.error) || {};
    opnSay(msgId, err.code === 'OPNOTE_VALUE_REVIEW' && err.message ? String(err.message) : OPN_SAY_REVIEW, true);
    opnShow(msgId, true);
    return null;
  }
  if (!r.ok) { opnSay(msgId, 'That did not go through. Try again in a moment.', true); opnShow(msgId, true); return null; }
  var d = await r.json();
  var saved = (d && d.job) || {};
  if (saved.version != null) opnOpen.version = saved.version;
  if (typeof saved.noteText === 'string') {
    opnOpen.noteText = saved.noteText;
    if (saved.blanks && saved.blanks.length !== undefined) opnOpen.blanks = saved.blanks;
    opnRenderJob(opnOpen);
    var body = opnEl('opnNote'); if (body) body.value = saved.noteText;
  } else {
    opnOpen.noteText = picked.noteText;
  }
  var patch = { updatedAt: saved.updatedAt };
  if (saved.filledCount != null) patch.filledCount = saved.filledCount;
  if (saved.blankCount != null) patch.blankCount = saved.blankCount;
  if (where === 'complete') patch.status = saved.status || 'completed';
  opnRemember(patch);
  return saved;
}

function opnRemember(patch) {
  for (var i = 0; i < opnJobs.length; i++) {
    if (opnJobs[i].id === (opnOpen && opnOpen.id)) {
      for (var key in patch) { if (Object.prototype.hasOwnProperty.call(patch, key)) opnJobs[i][key] = patch[key]; }
    }
  }
  opnRenderList();
}

async function opnOpenJob(id) {
  try {
    var r = await opnGet('/api/client/opnotes/jobs/' + encodeURIComponent(id));
    if (r.status === 401) { await opnHandle401(r); return; }
    if (!r.ok) { opnSay('jobMsg', 'That did not go through. Try again in a moment.', true); opnShow('jobMsg', true); return; }
    var d = await r.json();
    opnUndoText = '';
    opnRenderJob(d.job || {});
    /* opnsvc-1.0.0: a value typed earlier that is still not in the note is
       named again when the note is opened, not only right after the save -
       the practice sees the same list until it is typed in. */
    var still = opnNotPlacedSentence((d.job || {}).notPlaced);
    if (still) { opnSay('jobMsg', still.replace(/^ /, ''), true); opnShow('jobMsg', true); }
  } catch (e) { opnTrouble(); }
}

async function opnSaveJob() {
  if (!opnOpen) return false;
  try {
    var saved = await opnPush('save', 'jobMsg');
    if (!saved) return false;
    var left = opnNotPlacedSentence(saved.notPlaced);
    opnSay('jobMsg', 'Saved.' + left, !!left);
    opnShow('jobMsg', true);
    return true;
  } catch (e) { opnSay('jobMsg', 'That did not go through. Try again in a moment.', true); opnShow('jobMsg', true); return false; }
}

/* Mark done carries what is on screen too, so a value typed and never saved
   still goes into the note - it used to send only the version and lose it. */
async function opnCompleteJob() {
  if (!opnOpen) return;
  try {
    var saved = await opnPush('complete', 'jobMsg');
    if (!saved) return;
    var left = opnNotPlacedSentence(saved.notPlaced);
    opnSay('jobMsg', (left ? 'Marked done.' : 'Done. Nothing else to do.') + left, !!left);
    opnShow('jobMsg', true);
  } catch (e) { opnSay('jobMsg', 'That did not go through. Try again in a moment.', true); opnShow('jobMsg', true); }
}

/* ---- wrong template ----------------------------------------------------- */
/* retemplate-2.0.0. The note is written from whichever template matched its
   name, and that match is sometimes wrong - in one measured library, 199
   templates sat under 102 names and a 433-character stub with no operative
   narrative beat four full siblings that shared its name. The surgeon is the
   only person who can see that has happened, so the way out belongs here.

   This is deliberately ONE control and a plain sentence. It rewrites the note
   they already have into the shape of the template they pick. It is not a
   re-generation and no new clinical fact can enter: the server refuses a
   rewrite that lost a number or a blank and keeps the note exactly as it was.
   The previous wording is held in memory for one press of Put it back, which
   is why that button appears only after a rewrite and vanishes on save. */
var opnUndoText = '';
function opnRefitHtml(job) {
  var rows = opnTemplates || [];
  if (!rows.length) return '';
  var h = '<h2>Wrong template?</h2>' +
    '<p class="note">Pick the one this operation should have been written from and it will be rewritten to match. Read it before you mark it done.</p>' +
    '<select id="opnRefitPick">';
  for (var i = 0; i < rows.length; i++) {
    var sel = (String(rows[i].id) === String(job && job.templateId || '')) ? ' selected' : '';
    h += '<option value="' + opnEsc(rows[i].id) + '"' + sel + '>' + opnEsc(rows[i].name || 'Template') + '</option>';
  }
  h += '</select>' +
    '<button class="btn2" id="opnRefitGo" onclick="opnRefit()">Rewrite it with this template</button>' +
    '<button class="btn2 hide" id="opnRefitUndo" onclick="opnRefitUndo()">Put it back</button>' +
    '<p class="said hide" id="refitMsg"></p>';
  return h;
}

async function opnRefit() {
  if (!opnOpen) return;
  var pick = opnEl('opnRefitPick');
  var tid = pick ? String(pick.value || '') : '';
  if (!tid) return;
  /* opnsvc-1.0.0: the rewrite starts from the note the server holds. Words or
     values typed here and not saved yet would be replaced by the rewrite on
     screen and lost, so they are saved first - and nothing is rewritten if
     that save does not go through. */
  if (opnDirty()) {
    if (!(await opnSaveJob())) return;
    var again = opnEl('opnRefitPick'); if (again) again.value = tid;   // the save repainted the picker
  }
  var go = opnEl('opnRefitGo');
  if (go) { go.disabled = true; go.textContent = 'Rewriting...'; }
  opnSay('refitMsg', 'This takes a few seconds.', false);
  opnShow('refitMsg', true);
  try {
    var r = await opnPost('/api/client/opnotes/jobs/' + encodeURIComponent(opnOpen.id) + '/retemplate',
      { templateId: tid, expectedVersion: opnOpen.version });
    if (r.status === 401) { await opnHandle401(r); return; }
    var d = null;
    try { d = await r.json(); } catch (e) { d = null; }
    if (go) { go.disabled = false; go.textContent = 'Rewrite it with this template'; }
    if (r.status === 409 && d && d.error && d.error.code === 'OPNOTE_REFIT_UNSAFE') {
      /* The server would not store it, so nothing on this page changed. Say
         exactly that, because a surgeon who thinks a rewrite half-landed will
         go looking for what it did to their note. */
      opnSay('refitMsg', 'That rewrite left something out, so your note is exactly as it was. Edit it here instead.', true);
      opnShow('refitMsg', true);
      return;
    }
    /* refitfit-1.0.0: the server refuses a rewrite that does not follow the
       picked template's headings, and keeps the note as it was. Its message
       names what was missing; "did not go through" would send the surgeon to
       retry something that did go through and was judged. */
    if (r.status === 422 && d && d.error && d.error.code === 'OPNOTE_REFIT_NOT_FITTED') {
      opnSay('refitMsg', String(d.error.message || 'That rewrite did not follow the template, so your note is exactly as it was.'), true);
      opnShow('refitMsg', true);
      return;
    }
    if (r.status === 409) { opnSay('refitMsg', 'Someone else changed this note. Reload the page to see the newest one.', true); opnShow('refitMsg', true); return; }
    if (!r.ok || !d || !d.job) { opnSay('refitMsg', 'That did not go through. Try again in a moment.', true); opnShow('refitMsg', true); return; }
    var body = opnEl('opnNote');
    opnUndoText = String(d.previousText || (body ? body.value : '') || '');
    opnOpen.version = d.job.version;
    opnOpen.noteText = String(d.job.noteText || '');
    opnOpen.templateId = d.job.templateId || '';
    /* opnsvc-1.0.0: a rewrite can add blanks the new template asks for. The
       server sends the list for the rewritten note; the fields and the count
       follow it, keeping anything already typed for a blank still there. */
    if (d.job.blanks && d.job.blanks.length !== undefined) {
      opnOpen.blanks = d.job.blanks;
      opnRenderJob(opnOpen);
      body = opnEl('opnNote');
    }
    if (body) body.value = opnOpen.noteText;
    if (d.job.blankCount != null) opnRemember({ blankCount: d.job.blankCount, filledCount: d.job.filledCount, updatedAt: d.job.updatedAt });
    opnShow('opnRefitUndo', true);
    opnSay('refitMsg', 'Rewritten. Read it through, then Save.', false);
    opnShow('refitMsg', true);
  } catch (e) {
    if (go) { go.disabled = false; go.textContent = 'Rewrite it with this template'; }
    opnSay('refitMsg', 'That did not go through. Try again in a moment.', true);
    opnShow('refitMsg', true);
  }
}

/* Put it back only restores the WORDS. It does not undo the rewrite on the
   server; pressing Save after it is what makes the old wording the stored note
   again (and, since refitfit-1.0.0, puts the old template label back), and
   the sentence says so. */
function opnRefitUndo() {
  var body = opnEl('opnNote');
  if (!body || !opnUndoText) return;
  body.value = opnUndoText;
  opnShow('opnRefitUndo', false);
  opnSay('refitMsg', 'Put back. Press Save to keep it that way.', false);
  opnShow('refitMsg', true);
}

/* ---- templates --------------------------------------------------------- */
function opnRenderTemplates(list) {
  var host = opnEl('tplList');
  opnTemplates = list || [];
  if (!host) return;
  var rows = list || [];
  if (!rows.length) { host.innerHTML = '<p class="sub">Nothing here yet.</p>'; return; }
  var h = '';
  for (var i = 0; i < rows.length; i++) {
    h += '<div class="jobrow"><span class="jobtitle">' + opnEsc(rows[i].name || 'Template') + '</span></div>';
  }
  host.innerHTML = h;
}

function opnPickTemplate() { var f = opnEl('tplFile'); if (f && f.click) f.click(); }

/* connectmine-2.1.0: the surgeon already keeps their operative templates in MLS
   Scribe, so one press brings them across instead of uploading them again. The
   button is painted ONLY when the server has said there is an account at this
   address with an activated set that has operative templates in it - an offer
   that can only disappoint is worse than no offer at all. */
async function opnUseMine() {
  var b = opnEl('opnMineBtn');
  if (b) { b.disabled = true; b.textContent = 'Bringing them across...'; }
  try {
    var r = await opnPost('/api/client/opnotes/templates/mine', {});
    if (r.status === 401) { await opnHandle401(r); return; }
    var d = null; try { d = await r.json(); } catch (e) { d = null; }
    if (b) { b.disabled = false; b.textContent = 'Use my MLS Scribe templates'; }
    if (r.ok && d) {
      opnRenderTemplates(d.templates || []);
      var n = Number(d.saved || 0);
      opnSay('tplMsg', n + ' template' + (n === 1 ? '' : 's') + ' brought across.', false);
      opnShow('tplMsg', true);
      opnShow('opnMineBtn', false);
      /* The note on screen was painted from the list as it was, so its Wrong
         template control is now offering fewer templates than exist. Repaint it
         against the list we just received. */
      if (opnOpen && opnOpen.id) await opnOpenJob(opnOpen.id);
      return;
    }
    var said = String(((d || {}).error || {}).message || '');
    opnSay('tplMsg', said || 'That did not go through. Try again in a moment.', true);
    opnShow('tplMsg', true);
  } catch (e) {
    if (b) { b.disabled = false; b.textContent = 'Use my MLS Scribe templates'; }
    opnSay('tplMsg', 'That did not go through. Try again in a moment.', true);
    opnShow('tplMsg', true);
  }
}

/* Cleaning copied from the clinical app's own reader so a template reads the
   same here as it does there. */
function opnCleanText(t, lower) {
  t = String(t || '');
  if (/\.rtf$/.test(lower)) { t = t.replace(/\\par[d]?\b/g, '\n').replace(/\\'[0-9a-fA-F]{2}/g, '').replace(/\{\\\*[^{}]*\}/g, '').replace(/\\[a-zA-Z]+-?\d*\s?/g, '').replace(/[{}]/g, ''); }
  return t.replace(/\x00/g, '').replace(/[ \t]{3,}/g, '  ').replace(/\n{3,}/g, '\n\n').trim();
}

function opnTemplateChosen(input) {
  var f = input && input.files && input.files[0];
  if (!f) return;
  return opnReadTemplateFile(f);
}

async function opnReadTemplateFile(f) {
  var name = String(f.name || '');
  var lower = name.toLowerCase();
  if (/\.(pdf|png|jpe?g|heic|heif|gif|webp|tiff?|bmp)$/.test(lower)) {
    opnSay('tplMsg', 'Save it as a Word file or paste the text instead.', true);
    opnShow('tplMsg', true);
    return;
  }
  var text = '';
  try {
    if (/\.docx$/.test(lower)) {
      var buf = await f.arrayBuffer();
      var out = await window.mammoth.extractRawText({ arrayBuffer: buf });
      text = opnCleanText((out && out.value) || '', lower);
    } else {
      text = opnCleanText(await f.text(), lower);
    }
  } catch (e) {
    opnSay('tplMsg', 'That did not go through. Try again in a moment.', true);
    opnShow('tplMsg', true);
    return;
  }
  if (!text) {
    opnSay('tplMsg', 'Save it as a Word file or paste the text instead.', true);
    opnShow('tplMsg', true);
    return;
  }
  return opnSendTemplate(name.replace(/\.[A-Za-z0-9]+$/, '') || 'Template', text);
}

function opnSavePastedTemplate() {
  var nameField = opnEl('tplName');
  var pasteField = opnEl('tplPaste');
  var name = nameField ? String(nameField.value || '').trim() : '';
  var text = pasteField ? String(pasteField.value || '').trim() : '';
  if (!name || !text) {
    opnSay('tplMsg', 'Give it a name and paste the text first.', true);
    opnShow('tplMsg', true);
    return;
  }
  return opnSendTemplate(name, text);
}

async function opnSendTemplate(name, text) {
  try {
    var r = await opnPost('/api/client/opnotes/templates', { name: name, text: text });
    if (r.status === 401) { await opnHandle401(r); return; }
    if (!r.ok) { opnSay('tplMsg', 'That did not go through. Try again in a moment.', true); opnShow('tplMsg', true); return; }
    var d = await r.json();
    opnRenderTemplates(d.templates || []);
    var nameField = opnEl('tplName'); if (nameField) nameField.value = '';
    var pasteField = opnEl('tplPaste'); if (pasteField) pasteField.value = '';
    opnSay('tplMsg', 'Template saved.', false);
    opnShow('tplMsg', true);
  } catch (e) { opnSay('tplMsg', 'That did not go through. Try again in a moment.', true); opnShow('tplMsg', true); }
}

/* ---- opening the page -------------------------------------------------- */
/* Everything past the sign-in. Called once the credential exists, from the boot
   probe when the session was still good and from opnVerify when a code has just
   been accepted. */
async function opnOpenApp(client, who) {
  var c = client || {};
  /* Only when the server has said the press would do something. */
  if (who && who.hasMlsAccount) opnShow('opnMineBtn', true);
  var hdr = opnEl('hdr'); if (hdr) hdr.textContent = 'Op notes for ' + (c.name || 'you');
  var sub = opnEl('sub'); if (sub) sub.textContent = 'Everything is written for you. Fill in what only you know, then mark it done.';
  var g = opnEl('gate'); if (g) g.innerHTML = '';
  opnShow('gate', false);
  opnShow('app', true);

  /* Templates first on purpose: opening a note paints its Wrong template
     control from this list, and a list that arrives afterwards would give the
     first note the surgeon opens no way out of a bad match. */
  try {
    var tr = await opnGet('/api/client/opnotes/templates');
    if (tr.status === 401) { await opnHandle401(tr); return; }
    if (tr.ok) { var td = await tr.json(); opnRenderTemplates((td && td.templates) || []); }
  } catch (e) { opnRenderTemplates([]); }

  try {
    var jr = await opnGet('/api/client/opnotes/jobs');
    if (jr.status === 401) { await opnHandle401(jr); return; }
    if (jr.ok) { var jd = await jr.json(); opnJobs = (jd && jd.jobs) || []; }
  } catch (e) { opnJobs = []; }
  opnRenderList();

  /* Straight into the first one that still needs them. A surgeon who signed in
     to fill two blanks should not have to choose a row first; if everything is
     done, the list is the right thing to be looking at. */
  for (var i = 0; i < opnJobs.length; i++) {
    var j = opnJobs[i] || {};
    if (String(j.status || '') === 'completed') continue;
    if (Number(j.blankCount || 0) <= Number(j.filledCount || 0)) continue;
    await opnOpenJob(j.id);
    return;
  }
}

async function opnBoot() {
  /* opnlink-1.0.0: no link, or a cut-off one, is known right here - telling
     the surgeon their link "is no longer active" sent them to ask for a new
     one when all they had to do was open the email's link whole. Nothing
     about the server's answer is revealed: only a well-formed link is ever
     sent, and every refusal of it still reads the one dead-link sentence. */
  if (!K) { opnStopped('Open this page from the link in your op-note email.'); return; }
  if (!OPN_SHAPE.test(K)) { opnStopped('This link is incomplete. Open it straight from the email, or ask for a new one.'); return; }
  opnSessLoad();
  var who;
  try {
    var r = await opnGet('/api/client/opnotes/session');
    if (r.status === 401 && opnSess) {
      /* The stored session is spent or was killed. The LINK may still be
         perfectly good, so ask again as the link before giving up on it. */
      opnSessDrop();
      r = await opnGet('/api/client/opnotes/session');
    }
    if (r.status === 401 || r.status === 403 || r.status === 404) { opnDead(); return; }
    if (!r.ok) { opnTrouble(); return; }
    who = await r.json();
  } catch (e) { opnTrouble(); return; }

  if (who && who.needsSignIn) {
    opnHint = String(who.emailHint || '');
    opnSignInCard('');
    return;
  }
  await opnOpenApp((who && who.client) || {}, who);
}

window.opnReady = opnBoot();
</script>
