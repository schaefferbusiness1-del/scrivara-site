# Production GitHub Pages publication boundary.
#
# GitHub Pages publishes this repository from the branch root with Jekyll 3.10.
# The repository also contains extension source, test fixtures, staging snapshots,
# prototypes, extension candidate source, and historical release archives.
# HTML and ZIP files therefore fail closed: Jekyll excludes every one by
# default, and `include` re-opens only the reviewed public pages.
#
# Keep the allowlist and tests/public-publication-boundary.test.js synchronized.
# Candidate extension bytes remain excluded until a separately stamped release.

# GitHub Pages otherwise injects jekyll-theme-primer and publishes its
# generated assets/css/style.css. This application provides complete HTML/CSS
# and keeps the production tree on the explicit reviewed-file allowlist below.
theme: null

exclude:
  - ".git/"
  - ".github/"
  - ".codex-tools/"
  - ".bundle/"
  - ".jekyll-cache/"
  - ".sass-cache/"
  - "_site/"
  - "node_modules/"
  - "vendor/*"
  - "vendor/**/*"
  - "tests/"
  - "scripts/"
  - "api/"
  - "tmp/"
  - "tools/"
  - "_ws_tools/"
  # 2026-07-30 — NEITHER OF THESE IS AN APP ASSET, AND BOTH WERE BEING PUBLISHED.
  # The shipped app references them ZERO times (grep of ScribeFlow.html and
  # mls-connect.js), yet Jekyll was copying both into the public site: 51
  # coordination/inbox/*.js working notes, and extension candidate SOURCE for
  # 3.0.32-3.0.44 including MLS_Assist_v3.0.44.zip. The Pages audit was flagging
  # all of it as "unexpected/unreviewed", and that audit has not run since
  # 2026-07-19, so nobody saw the flag.
  # This changes no extension byte and no extension behaviour - the files stay
  # exactly where they are and every extension test still reads them from the
  # working tree. It only stops GitHub Pages serving them to the public.
  - "coordination/"
  - "extension-candidates/"
  # 2026-07-31 — the native app projects. mobile/ holds the Capacitor wrapper,
  # the generated Android and Xcode projects, the icon/splash sources and the
  # store paperwork. NONE of it is a website asset: the shipped app is
  # app.html, which is on the include allowlist below and is what mobile/
  # bundles. Without this line Jekyll copies ~130 files of Gradle config, Java,
  # Swift, a gradle-wrapper.jar and every generated launcher icon onto
  # mlsscribe.com, and the generated-tree audit flags all of it as unreviewed.
  - "mobile/"
  - "*.md"
  - "**/*.md"
  # Repository-level copyright notice. It governs the source tree, not the
  # served site; terms.html/privacy.html remain the public-facing legal pages.
  - "LICENSE"
  - "package.json"
  - "package-lock.json"
  - "Gemfile"
  - "Gemfile.lock"
  - "pages-publication-inventory.json"
  - "*.[Hh][Tt][Mm][Ll]"
  - "**/*.[Hh][Tt][Mm][Ll]"
  - "*.[Zz][Ii][Pp]"
  - "**/*.[Zz][Ii][Pp]"
  # 2026-08-08 (b948 deploy failure, the b946 class): .bin had NO exclude glob,
  # so when the released-package mirror moved 3.0.45 -> 3.0.46 the superseded
  # MLS_Assist_v3.0.45.bin still published, UNDECLARED, and the generated-tree
  # audit refused the deploy. Same rule as *.zip: every .bin is excluded and
  # only the include-allowlisted CURRENT release mirror publishes.
  - "*.[Bb][Ii][Nn]"
  - "**/*.[Bb][Ii][Nn]"
  - "*.[Ss][Tt][Aa][Gg][Ii][Nn][Gg].[Jj][Ss]"
  - "**/*.[Ss][Tt][Aa][Gg][Ii][Nn][Gg].[Jj][Ss]"
  - "*_[Ss][Tt][Aa][Gg][Ii][Nn][Gg]_*.[Jj][Ss]"
  - "**/*_[Ss][Tt][Aa][Gg][Ii][Nn][Gg]_*.[Jj][Ss]"
  - "*_[Aa][Pp][Pp][Ee][Nn][Dd]_*.[Jj][Ss]"
  - "bg_worker_block.[Jj][Ss]"
  - "feat_mls_staging_pack1.js"
  - "feat_mls_staging_exact_actions.js"
  - "feat_mls_exact_encounter_verify.js"
  - "feat_mls_review_request.js"
  - "feat_mls_best_doctors.js"
  - "legal-connect-ui.js"
  - "legal-chart-fill-ui.js"
  - "legal-tracker.js"
  - "feat_mls_expert_top.js"
  - "feat_mls_legal_exact.js"
  - "feat_mls_legal_pay_setup.js"
  - "feat_mls_legal_paywidget.js"
  - "feat_mls_legalpack.js"
  - "feat_mls_navfeat_keep.js"
  - "feat_mls_staff_hub.js"
  - "feat_mls_team_exact.js"
  # 2026-08-06 — 14 feat modules the shipped app references ZERO times (grep of
  # mls-connect.js + ScribeFlow.html at 408206ab), surfaced by the first
  # Actions-run publication audit. Dead code has no business being served;
  # excluding an unreferenced file cannot break the app. The three modules the
  # app DOES load (avatar, copilot_power, tele_doctor) went into the reviewed
  # inventory instead.
  - "feat_mls_cal_athena_sync.js"
  - "feat_mls_cal_fullwidth_providers.js"
  - "feat_mls_cal_provider_roster.js"
  - "feat_mls_day_agenda.js"
  - "feat_mls_day_pace.js"
  - "feat_mls_herotoday_fix.js"
  - "feat_mls_lastseen_rows.js"
  - "feat_mls_month_pull.js"
  - "feat_mls_next_patient.js"
  - "feat_mls_patientlock_b52.js"
  - "feat_mls_problem_strip_hide.js"
  - "feat_mls_problem_strip.js"
  - "feat_mls_selected_day_sync.js"
  - "feat_mls_send_portal_invite.js"
  - "manifest.json"
  - "background.js"
  - "inject_dom.js"
  - "destination_teach_navigation_guard.js"
  - "content.js"
  - "content.css"
  - "popup.html"
  - "popup.js"
  - "mls-popup.js"
  - "mls-popup.css"
  - "offscreen.html"
  - "offscreen.js"
  - "feat_codes_driver.js"
  - "ext_reviews_reader.js"
  - "write_safety_guard.js"
  - "review_screen.js"
  - "teach_destination_memory.js"
  - "expert-marketplace-ui.js"

include:
  # Public production navigation targets.
  - "404.html"
  - "appointment.html"
  - "assist.html"
  - "assist-privacy.html"
  - "best-doctors-optout.html"
  - "booking.html"
  - "expert.html"
  - "gbp-setup.html"
  - "get-extension.html"
  - "index.html"
  - "intake.html"
  - "lawyers.html"
  - "patient-portal.html"
  - "phone-setup.html"
  - "phone.html"
  - "privacy.html"
  - "review-finder.html"
  - "ScribeFlow.html"

  # 2026-08-12 — the 1p PREVIEW page (owner-only). Same app as ScribeFlow.html but
  # loading 1p-prefixed copies of the modules under test, so features can be tried
  # on the real site without touching a single production byte. It registers NO
  # service worker, so it can never cache anything or disturb the main app.
  - "1pScribeFlow.html"
  # Exact nested showcase path. Do not include bare directory basenames here:
  # Jekyll treats those broadly enough to reopen unrelated legal/test files.
  - "1p/legal/index.html"
  - "1p/marketing/index.html"

  # 2026-08-16 — the /cloned live route (owner-only for now). A byte-faithful
  # clone of ScribeFlow.html that will receive individual features promoted
  # from /1p one at a time, and eventually become the main site. Same shape
  # as the 1p live route above: it registers NO service worker, so it can
  # never cache anything or disturb the main app.
  # Exact nested path. Do not include a bare "cloned" directory basename here:
  # Jekyll treats those broadly enough to reopen unrelated files.
  - "cloned/index.html"

  # 2026-08-19 — /wyzant, the product page for Wyzant Local. A SEPARATE product
  # from the clinical platform: a standalone Windows app, no shared code, no app
  # script, no service worker. It is published from this repo only because the
  # domain is here. Exact nested path, for the same reason the two above are:
  # a bare "wyzant" basename would reopen unrelated files.
  - "wyzant/index.html"
  - "terms.html"

  # Minimum reviewed phone-recorder runtime. The recorder HTML is above; these
  # are the install manifest and the production ScribeFlow UI module it loads.
  - "phone-manifest.json"
  - "feat_mls_force_full_phone.js"

  # The phone app (2026-07-31). app.html is self-contained — no external script,
  # no stylesheet, no font — so this is its COMPLETE published surface: the page,
  # its install manifest, and the two store-size icons that manifest names. The
  # same app.html is what mobile/ bundles into the iOS and Android binaries.
  - "app.html"
  - "app-manifest.json"
  - "app-icon-1024.png"
  - "app-icon-maskable-1024.png"

  # Fail-closed, memory-only public synthetic preview boundary and its
  # canonical-workspace fixture runtime. Both are inert outside ?preview=1.
  - "public-preview-policy.js"
  - "public-preview-runtime.js"

  # Exact same-origin clinical runtime libraries. Jekyll 3.10 filters a nested
  # directory before it sees its children, then filters each child by basename.
  # `vendor` opens traversal while the two excludes above deny every child;
  # these unique basenames re-open only the six reviewed, provenance-pinned
  # files. The generated-tree audit verifies their output paths and exact bytes.
  - "vendor"
  - "chart.umd-4.5.1.js"
  - "xlsx.full-0.20.3.min.js"
  - "pdf-6.1.200.min.mjs"
  - "pdf.worker-6.1.200.min.mjs"
  - "mammoth.browser-1.12.0.min.js"
  - "jspdf.umd-4.2.1.min.js"

  # The exact released MLS Assist package (owner directive 2026-07-20).
  # SHA-256 70c7a57ca80bf58a946531775d6ab0398b9fd82558bb435a20c62d0b4909ac72 —
  # identical bytes to the stamped 3.0.22 Web Store release. Candidate/historical
  # ZIPs remain excluded by the fail-closed patterns above.
  - "MLS_Assist_v3.0.74.zip"
  # Byte-identical mirror of the line above, under an extension no service
  # worker generation retires. A worker keeps controlling a tab until every tab
  # closes and this app's worker deliberately declines skipWaiting(), so an
  # already-installed worker answers the .zip with 410 no matter what we ship.
  # Measured: the worker did not roll across three production deploys. The .bin
  # is the only route that reaches those browsers; the button carries
  # download="MLS_Assist_v3.0.74.zip" so the doctor still saves a .zip.
  - "MLS_Assist_v3.0.74.bin"

  # Required for the existing branch-based custom-domain deployment.
  - "CNAME"

encoding: utf-8
strict_front_matter: true
