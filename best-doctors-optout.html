<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">

<title>Opt out of rating contribution</title>
<!-- ==========================================================================
  best-doctors-optout.html — PATIENT opt-out (v1.0.0)
  Authoring lane best-doctors, 2026-07-08. Standalone, no login.

  The consent EXIT path for the per-visit rating engine. A patient who received
  a link (?t=<opaque token>) can exclude their visit from ever contributing to a
  doctor's aggregate rating. The token carries NO PHI; the page shows only the
  doctor's name and a single action. GET/POST /api/ratings/optout/:token.
  Even without opt-out, only DE-IDENTIFIED AGGREGATES are ever published — this
  page is the explicit, honored way to remove a visit entirely.
=========================================================================== -->
<style>
:root{--ink:#15243c;--sub:#5b6b83;--line:#dbe3f0;--teal:#19b8a6;--blue:#2f6bed;--bg:#f4f7fc}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:26px 16px 70px}
.mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(140deg,var(--teal),var(--blue));display:flex;align-items:center;justify-content:center}
.mark svg{width:28px;height:28px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 2px 10px rgba(21,36,60,.05)}
h1{font-size:20px;margin:10px 0 4px}
p{font-size:14px;line-height:1.55;color:#2b3a52}
.note{font-size:12.5px;color:var(--sub)}
.btn{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font-weight:800;font-size:15px}
.btn.primary{background:linear-gradient(90deg,var(--teal),var(--blue));color:#fff}
.done{background:#e9f9f4;color:#0d6a5b;border:1px solid #b7ecdf;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:700}
.bad{background:#fdecec;color:#a12; border:1px solid #f3c4c4;border-radius:10px;padding:12px 14px;font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<div data-mls-synthetic-boundary="1" role="note" aria-label="Synthetic evaluation only" style="box-sizing:border-box;width:calc(100% - 24px);max-width:920px;margin:12px auto 0;padding:10px 12px;background:#F7F3E8;border:1px solid #E8DCC0;border-radius:10px;color:#5E5138;font:600 13px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;text-align:center"><strong>Synthetic evaluation only.</strong> Use fictional information; do not enter real patient or clinical data.</div>
<div class="wrap">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 13c3-1 5-1 8 0s5 1 8 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7" r="2.4" fill="#fff"/></svg></div>
  <div class="card" id="card">
    <h1>Your privacy choice</h1>
    <div id="body"><p class="note">Loading…</p></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var BK = 'https://scrivara-backend.onrender.com';
  try { if (window.MLS_BACKEND_URL) BK = window.MLS_BACKEND_URL; } catch (e) {}
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var captured = (window.__mlsSensitiveUrl && window.__mlsSensitiveUrl.query) || {};
  var token = captured.t || captured.token || '';
  /* visitRatings.newToken() emits exactly 24 random bytes as lowercase hex. */
  if (!/^[a-f0-9]{48}$/.test(token)) { $('body').innerHTML = '<div class="bad">This link is missing or invalid. Please use the exact link you were given.</div>'; return; }

  mlsSensitiveFetch(BK + '/api/ratings/optout/' + encodeURIComponent(token), { headers: { 'Accept': 'application/json' } })
    .then(function (r) { return r.ok ? r.json() : null; }, function () { return null; })
    .then(function (j) {
      if (!j || !j.ok) { $('body').innerHTML = '<div class="bad">This link is no longer valid.</div>'; return; }
      if (j.alreadyOptedOut) { $('body').innerHTML = '<div class="done">Done — your visit is already excluded from any rating. Nothing further is needed.</div>'; return; }
      var doc = j.doctor ? (' with ' + esc(j.doctor)) : '';
      $('body').innerHTML =
        '<p>MLS computes a de-identified, aggregate patient-experience rating for doctors from real visits. <b>No patient identity, visit detail, or recording is ever published</b> — only an overall score.</p>'
        + '<p>If you prefer, you can exclude <b>your visit' + doc + '</b> so it never contributes to that rating. This does not affect your care in any way.</p>'
        + '<button class="btn primary" id="go">Exclude my visit</button>'
        + '<p class="note" style="margin-top:12px">You can also just close this page to leave things as they are.</p>';
      $('go').onclick = function () {
        $('go').disabled = true; $('go').textContent = 'Working…';
        mlsSensitiveFetch(BK + '/api/ratings/optout/' + encodeURIComponent(token), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
          .then(function (r) { return r.ok ? r.json() : null; }, function () { return null; })
          .then(function (res) {
            if (res && res.ok) { $('body').innerHTML = '<div class="done">Done. Your visit will not contribute to any rating. Thank you.</div>'; }
            else { $('body').innerHTML = '<div class="bad">Something went wrong. Please try again later.</div>'; }
          }, function () { $('body').innerHTML = '<div class="bad">We could not reach MLS. Check your connection and try again later.</div>'; });
      };
    }, function () { $('body').innerHTML = '<div class="bad">Could not load this page.</div>'; });
})();
</script>
</body>
</html>
