<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<script src="sensitive-workflow-bootstrap.js?v=20260718" data-query-keys="t token code invite" data-fragment-keys="token code invite" referrerpolicy="no-referrer"></script>
<title>Opt out of rating contribution</title>
<!-- ==========================================================================
  best-doctors-optout.html — PATIENT opt-out (v1.0.0)
  Authoring lane best-doctors, 2026-07-08. Standalone, no login.

  The consent EXIT path for the per-visit rating engine. A patient who received
  a link (?t=<opaque token>) can exclude their visit from ever contributing to a
  doctor's aggregate rating. The token carries NO PHI; the page shows only the
  doctor's name and a single action. GET/POST /api/ratings/optout/:token.
  Even without opt-out, only DE-IDENTIFIED AGGREGATES are ever published — this
  page is the explicit, honored way to remove a visit entirely.
=========================================================================== -->
<style>
:root{--ink:#1A211C;--sub:#68736B;--line:#E7E5DD;--teal:#2E6A4B;--blue:#204034;--bg:#FBFAF7}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:26px 16px 70px}
.mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(140deg,var(--teal),var(--blue));display:flex;align-items:center;justify-content:center}
.mark svg{width:28px;height:28px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 2px 10px rgba(21,36,60,.05)}
h1{font-size:20px;margin:10px 0 4px}
p{font-size:14px;line-height:1.55;color:#2b3a52}
.note{font-size:12.5px;color:var(--sub)}
.btn{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font-weight:800;font-size:15px}
.btn.primary{background:linear-gradient(90deg,var(--teal),var(--blue));color:#fff}
.btn.quiet{background:#fff;color:var(--ink);border:1.5px solid #d8dee6}
.btn.quiet:hover{background:#f6f8fa}
.btn:focus-visible{outline:3px solid #9ad7ff;outline-offset:2px}
.done{background:#e9f9f4;color:#0d6a5b;border:1px solid #b7ecdf;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:700}
.bad{background:#fdecec;color:#a12; border:1px solid #f3c4c4;border-radius:10px;padding:12px 14px;font-size:14px}
.hide{display:none}

  /* ---- mls motion kit (b573) ---- */
  @media (prefers-reduced-motion: no-preference){
    @keyframes mlsRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes mlsPop{0%{transform:scale(.92)}62%{transform:scale(1.04)}100%{transform:scale(1)}}
    @keyframes mlsBreathe{0%,100%{opacity:1}50%{opacity:.55}}
    @keyframes mlsSweep{from{background-position:-180% 0}to{background-position:180% 0}}
    .card,.state{animation:mlsRise .4s cubic-bezier(.2,.7,.3,1) both}
    .card:nth-of-type(2){animation-delay:.06s}
    .card:nth-of-type(3){animation-delay:.12s}
    .card:nth-of-type(4){animation-delay:.18s}
    .card:nth-of-type(5){animation-delay:.24s}
    .btn,button{transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .18s ease,background .18s ease,opacity .18s ease}
    .btn:active:not(:disabled),button:active:not(:disabled){transform:scale(.972)}
    input,select,textarea{transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}
    /* The success mark earns a beat - it is the one moment worth celebrating. */
    .big{animation:mlsPop .52s cubic-bezier(.2,.9,.3,1.25) both}
    /* "Loading…" should look alive rather than stuck. */
    #loading{animation:mlsRise .4s cubic-bezier(.2,.7,.3,1) both,mlsBreathe 1.8s ease-in-out .4s infinite}
  }
</style>
</head>
<body>
<div data-mls-synthetic-boundary="1" role="note" aria-label="Synthetic evaluation only" style="box-sizing:border-box;width:calc(100% - 24px);max-width:920px;margin:12px auto 0;padding:10px 12px;background:#F7F3E8;border:1px solid #E8DCC0;border-radius:10px;color:#5E5138;font:600 13px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;text-align:center"><strong>Synthetic evaluation only.</strong> Use fictional information; do not enter real patient or clinical data.</div>
<div class="wrap">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 13c3-1 5-1 8 0s5 1 8 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7" r="2.4" fill="#fff"/></svg></div>
  <div class="card" id="card">
    <h1>Your privacy choice</h1>
    <div id="body" role="status" aria-live="polite" aria-atomic="true"><p class="note">Loading…</p></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var BK = 'https://scrivara-backend.onrender.com';
  try { if (window.MLS_BACKEND_URL) BK = window.MLS_BACKEND_URL; } catch (e) {}
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var captured = (window.__mlsSensitiveUrl && window.__mlsSensitiveUrl.query) || {};
  var token = captured.t || captured.token || '';
  /* visitRatings.newToken() emits exactly 24 random bytes as lowercase hex. */
  /* A malformed token is a dead end with a route forward, like the retired-link
     path - not a bare error. The commonest cause is a link broken across two
     lines by an email client, which the patient can fix themselves. */
  if (!/^[a-f0-9]{48}$/.test(token)) {
    $('body').innerHTML = '<div class="bad">This link is incomplete, so your choice cannot be recorded here.</div>'
      + '<p class="note" style="margin-top:12px">Email programs sometimes break a long link across two lines. Try opening it again from the original message, or reply to that message and ask for a new one. Your care is not affected either way.</p>';
    return;
  }

  /* Three different situations used to collapse into one sentence: the link is
   * genuinely retired, MLS is having trouble, or this device could not reach
   * MLS at all. Only the first is permanent, and only the first is anything the
   * patient can act on. Previously a dropped request printed "This link is no
   * longer valid" and replaced every control on the page, so someone on a weak
   * connection was told their opt-out had expired and left with nothing to
   * press - and their visit would keep counting toward the rating because of a
   * transient failure. Each recoverable state now keeps a Try again control and
   * never implies the choice was saved. Both request sites are reused by retry
   * so the page keeps exactly two sensitive fetch call sites. */
  var URL_OPTOUT = BK + '/api/ratings/optout/' + encodeURIComponent(token);

  function render(html) { $('body').innerHTML = html; }

  /* A parsed answer means the server spoke: ok:false is a real "no", not a
   * fault. Only 5xx, an unreadable body, or a dead connection are retryable. */
  function classify(r) {
    if (r.ok) return r.json().then(function (j) { return { kind: 'answered', body: j }; }, function () { return { kind: 'trouble' }; });
    if (r.status === 404 || r.status === 410) return { kind: 'retired' };
    return { kind: 'trouble' };
  }
  function unreachable() { return { kind: 'offline' }; }

  function showRetired() {
    render('<div class="bad">This link is no longer valid, so your choice cannot be recorded here.</div>'
      + '<p class="note" style="margin-top:12px">If you still want your visit left out of any rating, reply to the message that contained this link and ask for a new one. Your care is not affected either way.</p>');
  }
  /* The retry has to LOOK like it did something. Pressing it re-issued the
     request while the failure message stayed on screen and the button kept its
     original label, so on a slow connection the page was indistinguishable
     from one that had ignored the tap - and a patient trying to withdraw
     consent would press it repeatedly or give up. */
  function showRecoverable(message, again) {
    render('<div class="bad">' + message + '</div>'
      + '<button class="btn quiet" id="again" style="margin-top:12px">Try again</button>');
    $('again').onclick = function () {
      var b = $('again');
      if (b) { b.disabled = true; b.textContent = 'Trying again…'; }
      again();
    };
  }

  function loadChoice() {
    render('<p class="note">Loading…</p>');
    mlsSensitiveFetch(URL_OPTOUT, { headers: { 'Accept': 'application/json' } })
      .then(classify, unreachable)
      .then(function (res) {
        if (res.kind === 'offline') return showRecoverable('We could not reach MLS just now, so your choice is not shown yet. Nothing has changed.', loadChoice);
        if (res.kind === 'trouble') return showRecoverable('MLS is having trouble right now, so your choice is not shown yet. Nothing has changed.', loadChoice);
        if (res.kind === 'retired') return showRetired();
        var j = res.body;
        if (!j || j.ok !== true) return showRetired();
        if (j.alreadyOptedOut) { render('<div class="done">Done — your visit is already excluded from any rating. Nothing further is needed.</div>'); return; }
        var doc = j.doctor ? (' with ' + esc(j.doctor)) : '';
        render('<p>MLS computes a de-identified, aggregate patient-experience rating for doctors from real visits. <b>No patient identity, visit detail, or recording is ever published</b> — only an overall score.</p>'
          + '<p>If you prefer, you can exclude <b>your visit' + doc + '</b> so it never contributes to that rating. This does not affect your care in any way.</p>'
          + '<button class="btn primary" id="go">Exclude my visit</button>'
          + '<p class="note" style="margin-top:12px">You can also just close this page to leave things as they are.</p>');
        $('go').onclick = submitOptOut;
      });
  }

  function submitOptOut() {
    var go = $('go');
    if (go) { go.disabled = true; go.textContent = 'Working…'; }
    mlsSensitiveFetch(URL_OPTOUT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
      .then(classify, unreachable)
      .then(function (res) {
        if (res.kind === 'answered' && res.body && res.body.ok === true) {
          render('<div class="done">Done. Your visit will not contribute to any rating. Thank you.</div>');
          return;
        }
        if (res.kind === 'answered' || res.kind === 'retired') return showRetired();
        if (res.kind === 'offline') return showRecoverable('Your visit has <b>not</b> been excluded yet — we could not reach MLS to save it. Nothing else has changed.', submitOptOut);
        return showRecoverable('Your visit has <b>not</b> been excluded yet — MLS could not save it just now. Nothing else has changed.', submitOptOut);
      });
  }

  loadChoice();
})();
</script>
</body>
</html>
